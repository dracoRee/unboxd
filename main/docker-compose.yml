services:
  postgres:
    image: postgres:16
    container_name: unboxed-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: unboxed
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: unboxed_dev
    ports:
      - "5433:5432"
    volumes:
      - unboxed_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unboxed -d unboxed_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  unboxed_postgres_dev_data:
