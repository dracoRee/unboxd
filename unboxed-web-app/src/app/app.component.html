<div class="main-page min-h-screen bg-gray-50 font-sans text-gray-900">
  <!-- Top Navigation Bar -->
  <div class="navbar">
    <app-navbar></app-navbar>
  </div>
  
  <!-- Routed Content Area -->
   <div class="content">
      <router-outlet></router-outlet>
   </div>
  
  <!-- Trade Modal -->
  <app-trade-modal 
    *ngIf="selectedTradeItem" 
    [targetItem]="selectedTradeItem"
    (close)="closeTradeModal()"
    (tradeSent)="handleTradeSent($event)"
  ></app-trade-modal>
</div>
