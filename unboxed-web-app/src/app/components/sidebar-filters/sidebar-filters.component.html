<div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-sm">
  <h2 class="text-lg font-bold mb-6">Filters</h2>

  <!-- Series Filter -->
  <div class="mb-8">
    <h3 class="text-sm font-semibold text-gray-900 mb-4 uppercase tracking-wider">Series</h3>
    @if (isLoadingSeries) {
      <div class="space-y-2">
        <div class="h-4 bg-gray-100 rounded animate-pulse w-3/4"></div>
        <div class="h-4 bg-gray-100 rounded animate-pulse w-1/2"></div>
      </div>
    } @else {
      <div class="mb-3">
        <input 
          type="text" 
          [(ngModel)]="seriesSearchTerm"
          placeholder="Search series..."
          class="w-full px-3 py-2 text-sm bg-white text-gray-900 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent-500 focus:border-transparent placeholder:text-gray-400"
        >
      </div>
      <div class="space-y-2 max-h-48 overflow-y-auto pr-2 custom-scrollbar">
        @for (series of filteredSeries; track series) {
          <label class="flex items-center gap-3 min-h-11 cursor-pointer group">
            <input 
              type="checkbox" 
              [checked]="selectedSeries.includes(series)"
              (change)="toggleSeries(series)"
              class="w-4 h-4 rounded border-gray-300 text-accent-600 focus:ring-accent-500"
            >
            <span class="text-sm text-gray-600 group-hover:text-gray-900">{{ series }}</span>
          </label>
        }
      </div>
    }
  </div>

  <!-- Value Range -->
  <div class="mb-8">
    <h3 class="text-sm font-semibold text-gray-900 mb-4 uppercase tracking-wider">Reference Value (Up to RM{{maxValue}})</h3>
    <div class="px-2">
      <input 
        type="range" 
        min="0" 
        max="500" 
        [(ngModel)]="maxValue"
        (input)="onValueChange()"
        class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-accent-600"
      >
      <div class="flex justify-between mt-2 text-xs text-gray-500 font-medium">
        <span>RM0</span>
        <span>RM500+</span>
      </div>
    </div>
  </div>

  <!-- Trade Type -->
  <div>
    <h3 class="text-sm font-semibold text-gray-900 mb-4 uppercase tracking-wider">Trade Type</h3>
    <div class="space-y-3">
      <label class="flex items-center gap-3 min-h-11 cursor-pointer group">
        <input type="radio" name="tradeType" class="w-4 h-4 border-gray-300 text-accent-600 focus:ring-accent-500">
        <span class="text-sm text-gray-600 group-hover:text-gray-900">Straight Swap</span>
      </label>
      <label class="flex items-center gap-3 min-h-11 cursor-pointer group">
        <input type="radio" name="tradeType" class="w-4 h-4 border-gray-300 text-accent-600 focus:ring-accent-500">
        <span class="text-sm text-gray-600 group-hover:text-gray-900">Swap + Top-up</span>
      </label>
    </div>
  </div>
</div>
