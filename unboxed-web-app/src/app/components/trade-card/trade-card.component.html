<div class="group bg-white rounded-2xl border border-gray-200 overflow-hidden hover:shadow-xl hover:border-accent-200 transition-all duration-300 flex flex-col h-full">
  <!-- Image Section -->
  <div class="relative aspect-square bg-gray-50 p-6 overflow-hidden">
    <img [src]="item.imageUrl" [alt]="item.name" class="w-full h-full object-contain group-hover:scale-110 transition-transform duration-500">
    
    <!-- Favourite Button -->
    <button 
      (click)="toggleFavourite($event)"
      class="absolute top-3 right-3 p-2 rounded-full bg-white/80 backdrop-blur-sm border border-gray-100 shadow-sm hover:bg-white transition-colors"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" [class.fill-red-500]="isFavourited" [class.text-red-500]="isFavourited" [class.text-gray-400]="!isFavourited" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
      </svg>
    </button>

    <!-- Rarity Badge -->
    <div class="absolute bottom-3 left-3">
      <span 
        [class.bg-purple-100]="item.rarity === 'Secret'"
        [class.text-purple-700]="item.rarity === 'Secret'"
        [class.bg-blue-100]="item.rarity === 'Rare'"
        [class.text-blue-700]="item.rarity === 'Rare'"
        [class.bg-gray-100]="item.rarity === 'Common'"
        [class.text-gray-700]="item.rarity === 'Common'"
        class="px-2 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider"
      >
        {{ item.rarity }}
      </span>
    </div>
  </div>

  <!-- Content Section -->
  <div class="p-5 flex flex-col flex-1">
    <div class="mb-1">
      <span class="text-[10px] font-bold text-accent-600 uppercase tracking-widest">{{ item.series }}</span>
    </div>
    <h3 class="text-lg font-bold text-gray-900 mb-4 line-clamp-1">{{ item.name }}</h3>
    
    <div class="flex items-center justify-between mb-6">
      <div>
        <span class="block text-[10px] text-gray-400 uppercase font-bold">Ref. Value</span>
        <span class="text-lg font-black text-gray-900">${{ item.referenceValue }}</span>
      </div>
      <div class="text-right">
        <span class="block text-[10px] text-gray-400 uppercase font-bold">Status</span>
        <span class="text-xs font-bold text-green-600 bg-green-50 px-2 py-0.5 rounded-full">Available</span>
      </div>
    </div>

    <div class="mt-auto pt-4 border-t border-gray-100 flex items-center justify-between gap-3">
      <div class="flex -space-x-2">
        <div class="w-6 h-6 rounded-full border-2 border-white bg-gray-200 flex items-center justify-center text-[8px] font-bold">H</div>
        <div class="w-6 h-6 rounded-full border-2 border-white bg-accent-100 flex items-center justify-center text-[8px] font-bold text-accent-700">W</div>
      </div>
      <button 
        (click)="onProposeTrade()"
        class="flex-1 bg-gray-900 text-white hover:bg-accent-600 py-2 rounded-xl text-sm font-bold transition-all"
      >
        Propose Trade
      </button>
    </div>
  </div>
</div>
