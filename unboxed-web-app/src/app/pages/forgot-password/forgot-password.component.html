<div class="login-container">
  <div class="auth-card glass">
    <span class="logo-area"><img src="logo-banner.PNG" alt="unboxed logo"></span>
    
    <h2>Forgot Password?</h2>
    <p class="subtitle">Enter the email you use for logging in and we'll send you a link to reset your password. </p>

    @if (success()) {
      <div class="success-content">
        <div class="success-icon">✓</div>
        <p>A reset link has been sent to your email address.</p>
        <button class="btn-primary" routerLink="/login">Back to Login</button>
      </div>
    } @else {
      <form (ngSubmit)="onSubmit()" #forgotForm="ngForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            [(ngModel)]="email" 
            placeholder="your@email.com" 
            required
          >
        </div>

        @if (error()) {
          <div class="error-banner">
            {{ error() }}
          </div>
        }

        <button type="submit" [disabled]="!forgotForm.form.valid || loading()" class="btn-primary">
          @if (loading()) {
            <span class="loader"></span>
          } @else {
            Send Reset Link
          }
        </button>
      </form>

      <div class="auth-footer">
        <p><a routerLink="/login">Back to Sign in</a></p>
      </div>
    }
  </div>
</div>
