<div class="login-container">
  <div class="auth-card glass">

      <span class="logo-area"><img src="logo-banner.PNG" alt="unboxed logo"></span>
    
    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to continue trading</p>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email"
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          placeholder="Enter your email" 
          required
          #emailInput="ngModel"
        >
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password">Password</label>
          <a routerLink="/forgot-password" class="forgot-link">Forgot?</a>
        </div>
        <div class="password-input-wrapper">
          <input 
            [type]="showPassword() ? 'text' : 'password'" 
            id="password" 
            name="password" 
            [(ngModel)]="password" 
            placeholder="Enter your password" 
            required
            #passwordInput="ngModel"
          >
          <button type="button" class="password-toggle" (click)="togglePasswordVisibility()" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
            @if (showPassword()) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            }
          </button>
        </div>
      </div>

      @if (error()) {
        <div class="error-banner">
          {{ error() }}
        </div>
      }

      <button type="submit" [disabled]="!loginForm.form.valid || loading()" class="btn-primary">
        @if (loading()) {
          <span class="loader"></span>
        } @else {
          Sign In
        }
      </button>

      <div class="divider">
        <span>or</span>
      </div>

      <button type="button" (click)="loginWithGoogle()" class="btn-google" [disabled]="loading()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo">
        Continue with Google
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register">Sign up</a></p>
    </div>
  </div>
</div>
