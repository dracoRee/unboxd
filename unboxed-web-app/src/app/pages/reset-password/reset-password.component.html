<div class="login-container">
  <div class="auth-card glass">
    <div class="logo">
      <span class="u-box">U</span>
      <h1>unboxed.</h1>
    </div>
    
    <h2>Reset Password</h2>
    <p class="subtitle">Enter your new password below.</p>

    @if (success()) {
      <div class="success-content">
        <div class="success-icon">✓</div>
        <p>Your password has been reset successfully.</p>
        <button class="btn-primary" routerLink="/login">Go to Login</button>
      </div>
    } @else {
      <form (ngSubmit)="onSubmit()" #resetForm="ngForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input 
            type="password" 
            id="newPassword" 
            name="newPassword" 
            [(ngModel)]="newPassword" 
            placeholder="••••••••" 
            required
            minlength="6"
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input 
            type="password" 
            id="confirmPassword" 
            name="confirmPassword" 
            [(ngModel)]="confirmPassword" 
            placeholder="••••••••" 
            required
          >
        </div>

        @if (error()) {
          <div class="error-banner">
            {{ error() }}
          </div>
        }

        <button type="submit" [disabled]="!resetForm.form.valid || loading() || !token" class="btn-primary">
          @if (loading()) {
            <span class="loader"></span>
          } @else {
            Reset Password
          }
        </button>
      </form>
    }
  </div>
</div>
