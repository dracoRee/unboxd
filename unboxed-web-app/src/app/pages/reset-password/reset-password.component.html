<div class="login-container">
  <div class="auth-card glass">
    <div class="logo">
      <span class="u-box">U</span>
      <h1>unboxd.</h1>
    </div>
    
    <h2>Reset Password</h2>
    <p class="subtitle">Enter your new password below.</p>

    @if (success()) {
      <div class="success-content">
        <div class="success-icon">✓</div>
        <p>Your password has been reset successfully.</p>
        <button class="btn-primary" routerLink="/login">Go to Login</button>
      </div>
    } @else {
      <form (ngSubmit)="onSubmit()" #resetForm="ngForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <div class="password-input-wrapper">
            <input 
              [type]="showNewPassword() ? 'text' : 'password'" 
              id="newPassword" 
              name="newPassword" 
              [(ngModel)]="newPassword" 
              placeholder="••••••••" 
              required
              minlength="6"
            >
            <button type="button" class="password-toggle" (click)="toggleNewPasswordVisibility()" [attr.aria-label]="showNewPassword() ? 'Hide password' : 'Show password'">
              @if (showNewPassword()) {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
              } @else {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              }
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="password-input-wrapper">
            <input 
              [type]="showConfirmPassword() ? 'text' : 'password'" 
              id="confirmPassword" 
              name="confirmPassword" 
              [(ngModel)]="confirmPassword" 
              placeholder="••••••••" 
              required
            >
            <button type="button" class="password-toggle" (click)="toggleConfirmPasswordVisibility()" [attr.aria-label]="showConfirmPassword() ? 'Hide password' : 'Show password'">
              @if (showConfirmPassword()) {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
              } @else {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              }
            </button>
          </div>
        </div>

        @if (error()) {
          <div class="error-banner">
            {{ error() }}
          </div>
        }

        <button type="submit" [disabled]="!resetForm.form.valid || loading() || !token" class="btn-primary">
          @if (loading()) {
            <span class="loader"></span>
          } @else {
            Reset Password
          }
        </button>
      </form>
    }
  </div>
</div>
