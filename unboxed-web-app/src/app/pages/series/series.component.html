<div class="container mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold mb-8 text-gray-900">Explore by Series</h1>

  @if (isLoading) {
    <div class="flex justify-center items-center h-64">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-accent-600"></div>
    </div>
  } @else {
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-4 gap-6">
      @for (series of seriesList; track series.id) {
        <div 
          (click)="selectSeries(series.name)"
          class="group bg-white rounded-xl shadow-sm hover:shadow-md transition-all cursor-pointer overflow-hidden border border-gray-100 hover:border-accent-200"
        >
          <!-- Series Image Placeholder or Actual Image -->
          <div class="aspect-square bg-gray-50 relative overflow-hidden">
            @if (series.imageUrl) {
              <img [src]="series.imageUrl" [alt]="series.name" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
            } @else {
              <div class="w-full h-full flex items-center justify-center bg-accent-50 text-accent-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                </svg>
              </div>
            }
          </div>
          
          <div class="p-4">
            <h3 class="font-bold text-gray-900 group-hover:text-accent-600 transition-colors truncate">{{ series.name }}</h3>
          </div>
        </div>
      }
    </div>
  }
</div>
